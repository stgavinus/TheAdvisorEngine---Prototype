<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}The Advisor Engine{% endblock %}</title>
  <meta name="csrf-token" content="{{ csrf_token() }}">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
  <link href="{{ url_for('static', filename='style.css') }}" rel="stylesheet">
  <script>
    // Set dark/light theme before first paint to avoid flash
    (function() {
      const dark = window.matchMedia('(prefers-color-scheme: dark)').matches;
      document.documentElement.setAttribute('data-bs-theme', dark ? 'dark' : 'light');
      window.matchMedia('(prefers-color-scheme: dark)').addEventListener('change', e => {
        document.documentElement.setAttribute('data-bs-theme', e.matches ? 'dark' : 'light');
      });
    })();
  </script>
</head>
<body>

<nav class="navbar navbar-expand-lg navbar-dark sticky-top" style="background-color:#B30000">
  <div class="container-fluid px-4">
    <a class="navbar-brand fw-bold d-flex align-items-center gap-2" href="{{ url_for('index') }}">
      <i class="bi bi-mortarboard-fill"></i>
      <span>The Advisor Engine</span>
      <span class="navbar-text fw-light ms-1" style="font-size:.75rem;opacity:.75;border-left:1px solid rgba(255,255,255,.3);padding-left:.6rem">The Catholic University of America</span>
    </a>
    <div class="navbar-nav ms-auto flex-row gap-3">
      <a class="nav-link" href="{{ url_for('my_plan') }}">
        <i class="bi bi-person-check me-1"></i>My Plan
      </a>
      {% if session.get('program') %}
        {% set p = session.get('program') %}
        <a class="nav-link" href="{{ url_for('audit', slug=p) }}">
          <i class="bi bi-clipboard-check me-1"></i>Audit
        </a>
      {% endif %}
      <a class="nav-link" href="{{ url_for('index') }}">
        <i class="bi bi-grid me-1"></i>Programs
      </a>
    </div>
  </div>
</nav>

<main class="container-fluid px-4 py-4">
  {% block content %}{% endblock %}
</main>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
<script src="{{ url_for('static', filename='script.js') }}"></script>
{% block extra_scripts %}{% endblock %}
</body>
</html>
